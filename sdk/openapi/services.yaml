schemas:
  NewService:
    description: |
      A service to create in an environment. Its source says where its deployments come
      from: an upload each `ajs cloud deploy` carries, or a repository AntelopeJS Cloud
      builds at each push.
    type: object
    required: [name, appName, source]
    properties:
      name: { type: string }
      appName: { type: string }
      source:
        oneOf:
          - $ref: '#/schemas/UploadSource'
          - $ref: '#/schemas/RepositorySource'
      port: { type: [integer, "null"] }
      isPublic: { type: boolean }
  UploadSource:
    type: object
    required: [type]
    properties:
      type: { type: string, const: upload }
  RepositorySource:
    description: |
      A GitHub repository the workspace's GitHub installation grants. Two services of one
      repository differ by their Dockerfile: an API built by the AntelopeJS recipe next to
      a dashboard built by `frontend.Dockerfile`.
    type: object
    required: [type, repository]
    properties:
      type: { type: string, const: repository }
      repository: { type: string, description: "The repository, as `owner/name`." }
      branch:
        description: The branch this service builds; null or absent follows its environment's branch.
        type: [string, "null"]
      dockerfilePath: { $ref: '#/schemas/DockerfilePath' }
  DockerfilePath:
    description: |
      Path, inside the repository, of the Dockerfile that builds the service, such as
      `frontend.Dockerfile` or `apps/web/Dockerfile`: plain segments of letters, digits,
      `.`, `_` and `-`, separated by `/`. Null or absent: the root `Dockerfile` when the
      repository has one, else a recipe.
    type: [string, "null"]
    maxLength: 255
  ServiceSettingsSource:
    description: Where the service's deployments come from.
    type: object
    required: [type]
    properties:
      type: { type: string, enum: [repository, image, upload, database] }
      repository: { type: [string, "null"], description: "`owner/name`, for a repository source." }
      dockerfilePath: { $ref: '#/schemas/DockerfilePath' }
paths:
  port:
    put:
      operationId: setServicePort
      description: |
        Sets the port the service's container listens on, or clears it with null. A service a
        project creation builds from a repository starts without one, and cannot be deployed
        until it has one: a deployment asked before fails with `cloud.errors.builds.missing_port`.

        The running revision keeps the port it was deployed with; the next deployment takes the
        new one.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: serviceId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [port]
              properties:
                port:
                  description: The port the container listens on; null for a service that listens on none.
                  type: [integer, "null"]
                  minimum: 1024
                  maximum: 65535
      responses:
        '200':
          description: Done
        '400':
          description: '`cloud.errors.settings.invalid_port`: the port is not an integer from 1024 to 65535.'
          content:
            application/json:
              schema: { $ref: './cloud.openapi.yaml#/components/schemas/Error' }
        '409':
          description: '`cloud.errors.settings.public_needs_port`: a public service cannot lose its port. `cloud.errors.settings.preview_read_only`: a preview mirrors its environment and is not edited.'
          content:
            application/json:
              schema: { $ref: './cloud.openapi.yaml#/components/schemas/Error' }
        default: { $ref: './cloud.openapi.yaml#/components/responses/Error' }
  variableReferences:
    post:
      operationId: followPublishedValue
      description: |
        Adds a variable to the service that follows a value another service of the same
        environment publishes, such as the `MONGO_URL` of a MongoDB resource: the variable takes
        the published value, and takes the new one when it changes. Listed afterwards with a
        `resource` origin. The value itself is never sent to the client.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: serviceId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, serviceId, publishedKey]
              properties:
                key:
                  description: The name of the variable on the service.
                  type: string
                serviceId:
                  description: The service that publishes the value.
                  type: string
                publishedKey:
                  description: The key the publisher publishes the value under.
                  type: string
      responses:
        '200':
          description: Done
        '400':
          description: '`cloud.errors.settings.invalid_key`: the name is not a valid variable name. `cloud.errors.settings.self_reference`: a service cannot follow its own value.'
          content:
            application/json:
              schema: { $ref: './cloud.openapi.yaml#/components/schemas/Error' }
        '404':
          description: '`cloud.errors.settings.unknown_publisher`: the environment has no such service. `cloud.errors.settings.key_not_published`: the publisher publishes no such key.'
          content:
            application/json:
              schema: { $ref: './cloud.openapi.yaml#/components/schemas/Error' }
        '409':
          description: '`cloud.errors.settings.duplicate_key`: the service already holds a variable of that name. `cloud.errors.settings.preview_read_only`: a preview mirrors its environment and is not edited.'
          content:
            application/json:
              schema: { $ref: './cloud.openapi.yaml#/components/schemas/Error' }
        default: { $ref: './cloud.openapi.yaml#/components/responses/Error' }
  network:
    put:
      operationId: setServiceExposure
      description: |
        Opens the service to the internet on its own address, or closes it. A service is created
        closed. Sending the exposure it already has changes nothing.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: serviceId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isPublic]
              properties:
                isPublic:
                  description: Whether the internet reaches the service on its own address.
                  type: boolean
      responses:
        '200':
          description: Done
        '409':
          description: '`cloud.errors.settings.public_needs_port`: a service without a port cannot be opened. `cloud.errors.settings.subdomain_taken`: another service holds its address. `cloud.errors.settings.preview_read_only`: a preview mirrors its environment and is not edited.'
          content:
            application/json:
              schema: { $ref: './cloud.openapi.yaml#/components/schemas/Error' }
        default: { $ref: './cloud.openapi.yaml#/components/responses/Error' }
  sourceDockerfile:
    put:
      operationId: setServiceDockerfile
      description: |
        Names the Dockerfile, inside its repository, that builds the service, or goes back
        to the root `Dockerfile` or a recipe with null. The next build reads it; the
        revisions already built keep their image. A build of a commit that holds no file at
        that path fails with `cloud.errors.builds.dockerfile_not_found`.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: serviceId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { $ref: '#/schemas/DockerfilePath' }
      responses:
        '200':
          description: Done
        '400':
          description: '`cloud.errors.settings.invalid_dockerfile_path`: not a plain relative path inside the repository.'
          content:
            application/json:
              schema: { $ref: './cloud.openapi.yaml#/components/schemas/Error' }
        '409':
          description: '`cloud.errors.settings.not_a_repository_source`: the service does not build a repository. `cloud.errors.settings.preview_read_only`: a preview mirrors its environment and is not edited.'
          content:
            application/json:
              schema: { $ref: './cloud.openapi.yaml#/components/schemas/Error' }
        default: { $ref: './cloud.openapi.yaml#/components/responses/Error' }
