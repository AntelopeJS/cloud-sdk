name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@v2
    with:
      renovate-sync: false
      windows: true
      windows-merge-queue: true
      extra-commands: |
        [ "$(git rev-parse --is-shallow-repository)" = false ] || git fetch --quiet --unshallow origin "$GITHUB_SHA"
        pnpm run check:hosts
      docs-files: |
        README.md
        cli/README.md
        sdk/README.md
      docs-typescript-project: cli/tsconfig.json
      test-job: true
      affected-tests: true
    permissions:
      contents: read
  renovate-sync:
    if: >-
      github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      actions: write
      statuses: write
    uses: AntelopeJS/.github/.github/workflows/ci-renovate-sync.yml@v2
