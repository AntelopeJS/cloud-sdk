name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@v1
    with:
      renovate-sync: false
      extra-commands: |
        git fetch --quiet --unshallow origin "$GITHUB_SHA"
        pnpm run check:hosts
        pnpm run check:generated
      docs-files: |
        README.md
        cli/README.md
        sdk/README.md
      docs-typescript-project: cli/tsconfig.json
      test-job: true
    permissions:
      contents: read
  renovate-sync:
    if: >-
      github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      actions: write
    uses: AntelopeJS/.github/.github/workflows/ci-renovate-sync.yml@v1
