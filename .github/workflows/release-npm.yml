name: Release public npm package

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to release; the SDK goes first, the CLI depends on it
        required: true
        type: choice
        options: [sdk, cli]
      channel:
        description: npm distribution channel
        required: true
        default: latest
        type: choice
        options: [latest, next]
      release-version:
        description: Exact stable version; empty uses the automatic increment
        default: ""
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    name: Validate package release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate release source and package metadata
        env:
          CHANNEL: ${{ inputs.channel }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PACKAGE_DIRECTORY: ${{ inputs.package }}
        run: |
          case "$CHANNEL" in
            latest) release_branch=$DEFAULT_BRANCH ;;
            next) release_branch=next ;;
            *) echo "Unsupported npm channel: $CHANNEL" >&2; exit 1 ;;
          esac
          test "$GITHUB_REF" = "refs/heads/$release_branch" || {
            echo "The $CHANNEL channel must be released from the $release_branch branch, not $GITHUB_REF." >&2
            exit 1
          }
          node <<'NODE'
          const directory = process.env.PACKAGE_DIRECTORY
          const names = { sdk: '@antelopejs/cloud-sdk', cli: '@antelopejs/cloud' }
          const pkg = require(`./${directory}/package.json`)
          const errors = []
          if (pkg.name !== names[directory]) errors.push(`name must be ${names[directory]}`)
          if (pkg.repository?.url !== 'git+https://github.com/AntelopeJS/cloud-sdk.git') {
            errors.push('repository.url must point at AntelopeJS/cloud-sdk')
          }
          if (pkg.repository?.directory !== directory) errors.push(`repository.directory must be ${directory}`)
          if (pkg.publishConfig?.access !== 'public') errors.push('publishConfig.access must be public')
          if (pkg.publishConfig?.provenance !== true) errors.push('publishConfig.provenance must be true')
          if (pkg.publishConfig?.registry !== 'https://registry.npmjs.org/') {
            errors.push('publishConfig.registry must be the public npm registry')
          }
          if (errors.length) {
            console.error(errors.join('\n'))
            process.exit(1)
          }
          NODE

      - name: Verify the SDK range of the CLI resolves on npm
        if: inputs.package == 'cli'
        run: |
          range=$(node -p "require('./cli/package.json').dependencies['@antelopejs/cloud-sdk']")
          resolved=$(npm view "@antelopejs/cloud-sdk@$range" version --registry=https://registry.npmjs.org/) || resolved=""
          test -n "$resolved" || {
            echo "No @antelopejs/cloud-sdk version matching $range is on https://registry.npmjs.org/; release the sdk package first." >&2
            exit 1
          }

  release:
    needs: validate
    uses: AntelopeJS/.github/.github/workflows/release-npm-public.yml@7ad269a39f1a59ca8469f6002c0b15820ff911be
    with:
      channel: ${{ inputs.channel }}
      release-version: ${{ inputs.release-version }}
      package-directory: ${{ inputs.package }}
    secrets:
      RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
