schemas:
  ServiceVolume:
    description: A persistent volume a service mounts.
    type: object
    required: [name, mountPath, sizeGb]
    properties:
      name:
        description: A lowercase DNS label of at most 63 characters.
        type: string
        minLength: 1
        maxLength: 63
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
      mountPath:
        description: The normalized absolute path the container mounts the volume at.
        type: string
        maxLength: 4096
      sizeGb:
        description: The size in whole GiB, from the `volumeLimits` of the service's settings; the plan's own ceiling applies on top.
        type: integer
        minimum: 1
  ServiceSettingsVolume:
    description: A volume of a service, with the space it uses.
    allOf:
      - $ref: '#/schemas/ServiceVolume'
      - type: object
        required: [usedGb]
        properties:
          usedGb:
            description: The space consumed, in GiB; null when the platform could not measure it.
            type: [number, "null"]
  NewService:
    description: |
      A service to create in an environment. Its source says where its deployments come
      from: an upload each `ajs cloud deploy` carries, or a repository AntelopeJS Cloud
      builds at each push.
    type: object
    required: [name, appName, source]
    properties:
      name: { type: string }
      appName: { type: string }
      source: { $ref: '#/schemas/ServiceSource' }
      port: { type: [integer, "null"] }
      isPublic: { type: boolean }
  UploadSource:
    type: object
    required: [type]
    properties:
      type: { type: string, const: upload }
  RepositorySource:
    description: |
      A GitHub repository the workspace's GitHub installation grants. Two services of one
      repository differ by their Dockerfile, an API built by the AntelopeJS recipe next to
      a dashboard built by `frontend.Dockerfile`, or by their root folder, `apps/api` next
      to `apps/web` in a monorepo.
    type: object
    required: [type, repository]
    properties:
      type: { type: string, const: repository }
      repository: { type: string, description: "The repository, as `owner/name`." }
      branch:
        description: The branch this service builds; null or absent follows its environment's branch.
        type: [string, "null"]
      dockerfilePath: { $ref: '#/schemas/DockerfilePath' }
      rootPath: { $ref: '#/schemas/RootPath' }
      sharedPaths: { $ref: '#/schemas/SharedPaths' }
  ServiceSource:
    description: |
      Where a service's deployments come from, as it is written: an upload each
      `ajs cloud deploy` carries, or a repository AntelopeJS Cloud builds at each push.
    oneOf:
      - $ref: '#/schemas/UploadSource'
      - $ref: '#/schemas/RepositorySource'
  RepositoryPath:
    description: |
      A file or folder inside the repository, relative to its root: plain segments of
      letters, digits, `.`, `_` and `-`, separated by `/`, none of them `.` or `..`, 255
      characters at most. An absolute path, a drive letter, a backslash, a blank, a
      trailing slash or any other character is refused.
    type: string
    maxLength: 255
    pattern: '^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$'
  DockerfilePath:
    description: |
      Path, inside the repository, of the Dockerfile that builds the service, such as
      `frontend.Dockerfile` or `apps/web/Dockerfile`: plain segments of letters, digits,
      `.`, `_` and `-`, separated by `/`. Null or absent: the root `Dockerfile` when the
      repository has one, else a recipe. Relative to the repository, not to the root
      folder: `docker/web.Dockerfile` with the root folder `apps/web` builds the folder
      with a Dockerfile kept outside it.
    type: [string, "null"]
    maxLength: 255
  RootPath:
    description: |
      The folder of the repository the service builds from, such as `apps/web`: the build
      context holds that folder and nothing else, the recipe reads the folder's
      `package.json`, and a push rebuilds the service only when it touches the folder, one
      of its shared paths or its Dockerfile. A path as `RepositoryPath` defines it. Null
      or absent: the repository root, rebuilt at every push. A build of a commit that
      holds nothing under the folder fails with `cloud.errors.builds.root_folder_not_found`.
    type: [string, "null"]
    maxLength: 255
    pattern: '^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$'
  SharedPaths:
    description: |
      Files or folders outside the root folder a push rebuilds the service for, such as a
      shared package (`packages/ui`) or the lockfile at the repository root
      (`pnpm-lock.yaml`), 20 at most, each as `RepositoryPath` defines it. They steer which
      pushes rebuild the service, never the build context. Read only when a root folder is
      set; an empty list, or an absent field, names none.
    type: array
    maxItems: 20
    uniqueItems: true
    items: { $ref: '#/schemas/RepositoryPath' }
  ServiceSettingsSource:
    description: Where the service's deployments come from.
    type: object
    required: [type]
    properties:
      type: { type: string, enum: [repository, image, upload, database] }
      repository: { type: [string, "null"], description: "`owner/name`, for a repository source." }
      dockerfilePath: { $ref: '#/schemas/DockerfilePath' }
      rootPath:
        description: The folder a repository service builds from; null for the repository root, and for every other source. Absent from an API older than this field.
        type: [string, "null"]
      sharedPaths:
        description: The paths outside the root folder a push rebuilds a repository service for; empty for every other source. Absent from an API older than this field.
        type: array
        items: { type: string }
paths:
  volumes:
    post:
      operationId: attachServiceVolume
      description: |
        Attaches a persistent volume to a service that has none: a service holds one volume. The
        service is pinned to one replica, and a deployed service is redeployed with the volume
        mounted.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: serviceId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/schemas/ServiceVolume' }
      responses:
        '200':
          description: Done
        '400':
          description: '`cloud.errors.settings.invalid_volume`: the name is not a lowercase DNS label, the mount path is not a normalized absolute path, or the size is not a whole number of GiB within the volume limits.'
          content:
            application/json:
              schema: { $ref: './cloud.openapi.yaml#/components/schemas/Error' }
        '409':
          description: '`cloud.errors.settings.volume_already_attached`: the service already has a volume. `cloud.errors.limits.volumes_per_workspace`: the workspace holds as many volumes as its plan allows. `cloud.errors.limits.volume_size_bytes`: the size is over the plan''s ceiling for one volume. `cloud.errors.settings.preview_read_only`: a preview mirrors its environment and is not edited.'
          content:
            application/json:
              schema: { $ref: './cloud.openapi.yaml#/components/schemas/Error' }
        default: { $ref: './cloud.openapi.yaml#/components/responses/Error' }
  port:
    put:
      operationId: setServicePort
      description: |
        Sets the port the service's container listens on, or clears it with null. A service a
        project creation builds from a repository starts without one, and cannot be deployed
        until it has one: a deployment asked before fails with `cloud.errors.builds.missing_port`.

        The running revision keeps the port it was deployed with; the next deployment takes the
        new one.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: serviceId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [port]
              properties:
                port:
                  description: The port the container listens on; null for a service that listens on none.
                  type: [integer, "null"]
                  minimum: 1024
                  maximum: 65535
      responses:
        '200':
          description: Done
        '400':
          description: '`cloud.errors.settings.invalid_port`: the port is not an integer from 1024 to 65535.'
          content:
            application/json:
              schema: { $ref: './cloud.openapi.yaml#/components/schemas/Error' }
        '409':
          description: '`cloud.errors.settings.public_needs_port`: a public service cannot lose its port. `cloud.errors.settings.preview_read_only`: a preview mirrors its environment and is not edited.'
          content:
            application/json:
              schema: { $ref: './cloud.openapi.yaml#/components/schemas/Error' }
        default: { $ref: './cloud.openapi.yaml#/components/responses/Error' }
  variableReferences:
    post:
      operationId: followPublishedValue
      description: |
        Adds a variable to the service that follows a value another service of the same
        environment publishes, such as the `MONGO_URL` of a MongoDB resource: the variable takes
        the published value, and takes the new one when it changes. Listed afterwards with a
        `resource` origin. The value itself is never sent to the client.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: serviceId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, serviceId, publishedKey]
              properties:
                key:
                  description: The name of the variable on the service.
                  type: string
                serviceId:
                  description: The service that publishes the value.
                  type: string
                publishedKey:
                  description: The key the publisher publishes the value under.
                  type: string
      responses:
        '200':
          description: Done
        '400':
          description: '`cloud.errors.settings.invalid_key`: the name is not a valid variable name. `cloud.errors.settings.self_reference`: a service cannot follow its own value.'
          content:
            application/json:
              schema: { $ref: './cloud.openapi.yaml#/components/schemas/Error' }
        '404':
          description: '`cloud.errors.settings.unknown_publisher`: the environment has no such service. `cloud.errors.settings.key_not_published`: the publisher publishes no such key.'
          content:
            application/json:
              schema: { $ref: './cloud.openapi.yaml#/components/schemas/Error' }
        '409':
          description: '`cloud.errors.settings.duplicate_key`: the service already holds a variable of that name. `cloud.errors.settings.preview_read_only`: a preview mirrors its environment and is not edited.'
          content:
            application/json:
              schema: { $ref: './cloud.openapi.yaml#/components/schemas/Error' }
        default: { $ref: './cloud.openapi.yaml#/components/responses/Error' }
  network:
    put:
      operationId: setServiceExposure
      description: |
        Opens the service to the internet on its own address, or closes it. A service is created
        closed. Sending the exposure it already has changes nothing.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: serviceId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isPublic]
              properties:
                isPublic:
                  description: Whether the internet reaches the service on its own address.
                  type: boolean
      responses:
        '200':
          description: Done
        '409':
          description: '`cloud.errors.settings.public_needs_port`: a service without a port cannot be opened. `cloud.errors.settings.subdomain_taken`: another service holds its address. `cloud.errors.settings.preview_read_only`: a preview mirrors its environment and is not edited.'
          content:
            application/json:
              schema: { $ref: './cloud.openapi.yaml#/components/schemas/Error' }
        default: { $ref: './cloud.openapi.yaml#/components/responses/Error' }
  source:
    put:
      operationId: setServiceSource
      description: |
        Points the service at another source, the whole of it in one write: an upload each
        `ajs cloud deploy` carries, or a repository with its branch, Dockerfile, root folder
        and shared paths. An upload and a repository do not share a field, so switching
        between them is one write of one value, and a repository field left out is cleared.
        Configuration only: what runs changes at the next deployment, and the revisions
        already built keep their image.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: serviceId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/schemas/ServiceSource' }
      responses:
        '200':
          description: Done
        '400':
          description: '`cloud.errors.settings.invalid_source`: neither an upload nor a repository as `owner/name` with a valid branch. `cloud.errors.settings.invalid_dockerfile_path`, `cloud.errors.settings.invalid_root_path`, `cloud.errors.settings.invalid_shared_paths`: that field is not a plain relative path inside the repository, or holds more than 20 shared paths.'
          content:
            application/json:
              schema: { $ref: './cloud.openapi.yaml#/components/schemas/Error' }
        '403':
          description: '`cloud.errors.projects.repository_not_granted`: the workspace''s GitHub installation does not grant the repository.'
          content:
            application/json:
              schema: { $ref: './cloud.openapi.yaml#/components/schemas/Error' }
        '409':
          description: '`cloud.errors.settings.preview_read_only`: a preview mirrors its environment and is not edited.'
          content:
            application/json:
              schema: { $ref: './cloud.openapi.yaml#/components/schemas/Error' }
        default: { $ref: './cloud.openapi.yaml#/components/responses/Error' }
  sourceRootPath:
    put:
      operationId: setServiceRootPath
      description: |
        Names the folder of its repository the service builds from, such as `apps/web` in a
        monorepo, or goes back to the repository root with null. The next build takes the
        folder as its context, with the Dockerfile `dockerfilePath` names written at its
        root, and the next push rebuilds the service only when it touches the folder, one of
        its shared paths or its Dockerfile; the revisions already built keep their image. A
        build of a commit that holds nothing under the folder fails with
        `cloud.errors.builds.root_folder_not_found`.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: serviceId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { $ref: '#/schemas/RootPath' }
      responses:
        '200':
          description: Done
        '400':
          description: '`cloud.errors.settings.invalid_root_path`: not a plain relative path inside the repository.'
          content:
            application/json:
              schema: { $ref: './cloud.openapi.yaml#/components/schemas/Error' }
        '409':
          description: '`cloud.errors.settings.not_a_repository_source`: the service does not build a repository. `cloud.errors.settings.preview_read_only`: a preview mirrors its environment and is not edited.'
          content:
            application/json:
              schema: { $ref: './cloud.openapi.yaml#/components/schemas/Error' }
        default: { $ref: './cloud.openapi.yaml#/components/responses/Error' }
  sourceSharedPaths:
    put:
      operationId: setServiceSharedPaths
      description: |
        Names the paths outside the root folder a push rebuilds the service for, such as a
        shared package or the lockfile at the repository root; an empty list clears them.
        The next push reads them, and only while the service has a root folder: without one,
        every push rebuilds the service. Besides a list, the API reads the paths from one
        text separated by blanks or commas; the SDK sends a list.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: serviceId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paths]
              properties:
                paths: { $ref: '#/schemas/SharedPaths' }
      responses:
        '200':
          description: Done
        '400':
          description: '`cloud.errors.settings.invalid_shared_paths`: more than 20 paths, or one that is not a plain relative path inside the repository.'
          content:
            application/json:
              schema: { $ref: './cloud.openapi.yaml#/components/schemas/Error' }
        '409':
          description: '`cloud.errors.settings.not_a_repository_source`: the service does not build a repository. `cloud.errors.settings.preview_read_only`: a preview mirrors its environment and is not edited.'
          content:
            application/json:
              schema: { $ref: './cloud.openapi.yaml#/components/schemas/Error' }
        default: { $ref: './cloud.openapi.yaml#/components/responses/Error' }
  sourceDockerfile:
    put:
      operationId: setServiceDockerfile
      description: |
        Names the Dockerfile, inside its repository, that builds the service, or goes back
        to the root `Dockerfile` or a recipe with null. The next build reads it; the
        revisions already built keep their image. A build of a commit that holds no file at
        that path fails with `cloud.errors.builds.dockerfile_not_found`.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: serviceId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { $ref: '#/schemas/DockerfilePath' }
      responses:
        '200':
          description: Done
        '400':
          description: '`cloud.errors.settings.invalid_dockerfile_path`: not a plain relative path inside the repository.'
          content:
            application/json:
              schema: { $ref: './cloud.openapi.yaml#/components/schemas/Error' }
        '409':
          description: '`cloud.errors.settings.not_a_repository_source`: the service does not build a repository. `cloud.errors.settings.preview_read_only`: a preview mirrors its environment and is not edited.'
          content:
            application/json:
              schema: { $ref: './cloud.openapi.yaml#/components/schemas/Error' }
        default: { $ref: './cloud.openapi.yaml#/components/responses/Error' }
