name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [next]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  ci:
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@ci/wdf26acfc-25-affected-tests
    with:
      affected-tests: true
      single-job: false
      renovate-sync: false
      windows: true
      windows-pull-requests: true
      extra-commands: |
        git fetch --quiet --unshallow origin "$GITHUB_SHA"
        pnpm run check:hosts
      docs-files: |
        README.md
        cli/README.md
        sdk/README.md
      docs-typescript-project: cli/tsconfig.json
      test-job: true
    permissions:
      contents: read
  renovate-sync:
    if: >-
      github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      actions: write
    uses: AntelopeJS/.github/.github/workflows/ci-renovate-sync.yml@v2
